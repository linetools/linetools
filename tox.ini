[tox]
envlist =
    py{311,312,313,314}-test
    py311-test-oldestdeps
    py313-test-devdeps
    docs
    codestyle
requires =
    pip >= 19.3.1
isolated_build = true
indexserver =
    NIGHTLY = https://pypi.anaconda.org/scientific-python-nightly-wheels/simple

[testenv]
# Suppress display of matplotlib plots generated during the test run
setenv = MPLBACKEND=agg

# Pass through the following environment variables which may be needed for CI
passenv = HOME,WINDIR,LC_ALL,LC_CTYPE,CC,CI

# Run the tests in a temporary directory to make sure that we don't import
# this package from the source tree
changedir = .tmp/{envname}

# tox environments are constructed with so-called 'factors' (or terms)
# separated by hyphens, e.g. test-devdeps. Lines below starting with factor:
# will only take effect if that factor is included in the environment name.
#
#     tox -l -v
#
description =
    run tests
    devdeps: with the latest developer version of key dependencies
    oldestdeps: with the oldest supported version of key dependencies
    cov: and test coverage

# These pins must match the floors declared in pyproject.toml.  Their whole
# purpose is to prove those floors are real.
deps =
    oldestdeps: numpy==1.24.*
    oldestdeps: astropy==5.3.*
    oldestdeps: scipy==1.10.*
    oldestdeps: h5py==3.8.*
    oldestdeps: matplotlib==3.6.*
    oldestdeps: PyYAML==6.0.*
    oldestdeps: IPython==8.0.*
    oldestdeps: qtpy==2.0.*

    devdeps: :NIGHTLY:numpy
    devdeps: git+https://github.com/astropy/astropy.git#egg=astropy

    cov: pytest-cov

extras =
    test

commands =
    pip freeze
    !cov: pytest --pyargs linetools {posargs}
    cov: pytest --pyargs linetools --cov linetools --cov-report=xml:{toxinidir}/coverage.xml {posargs}


[testenv:docs]
changedir = docs
description = build the Sphinx documentation
extras = docs
commands =
    sphinx-build -W -b html . _build/html


[testenv:codestyle]
skip_install = true
changedir = .
description = check code style, e.g. with pycodestyle
deps = pycodestyle
commands = pycodestyle linetools --count --select=E9
